<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir — M Miftahul Rizky A</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="editor" role="main" aria-label="Halaman formulir dalam bentuk kode">

        <div class="titlebar">
            <div class="dots" aria-hidden="true">
                <span class="dot dot-a"></span>
                <span class="dot dot-b"></span>
                <span class="dot dot-c"></span>
            </div>
            <nav class="tabs" aria-label="Navigasi halaman">
                <a href="index.html" class="tab">profile.js</a>
                <a href="portofolio.html" class="tab">portfolio.js</a>
                <a href="kontak.html" class="tab">contact.js</a>
                <a href="formulir.html" class="tab active">form.js</a>
            </nav>
            <span class="filestatus" aria-hidden="true">●</span>
        </div>

        <div class="editor-body">

            <p class="line comment">
                <span class="token-comment">// Kirim pesan langsung ke saya</span>
            </p>

            <p class="line">
                <span class="keyword">function</span> <span class="func">handleSubmit</span><span class="punct">(</span><span class="variable">data</span><span class="punct">) {</span>
            </p>

            <p class="line indent">
                <span class="variable">sendMessage</span><span class="punct">(</span><span class="variable">data</span><span class="punct">);</span>
            </p>

            <p class="line">
                <span class="punct">}</span>
            </p>

            <p class="line blank" aria-hidden="true"></p>

            <p class="line call">
                <span class="func">render</span><span class="punct">(</span><span class="variable">&lt;ContactForm onSubmit={handleSubmit} /&gt;</span><span class="punct">);</span>
                <span class="cursor" aria-hidden="true"></span>
            </p>

        </div>

        <div class="preview">
            <div class="preview-header">
                <span class="preview-label">Live Preview</span>
            </div>
            <div class="preview-body">
                <form class="contact-form" action="mailto:nama@email.com" method="post" enctype="text/plain">

                    <label class="form-field">
                        <span class="field-label"><span class="field-key">name</span><span class="punct">:</span></span>
                        <input type="text" name="name" placeholder="Nama kamu" required>
                    </label>

                    <label class="form-field">
                        <span class="field-label"><span class="field-key">email</span><span class="punct">:</span></span>
                        <input type="email" name="email" placeholder="email@kamu.com" required>
                    </label>

                    <label class="form-field form-field-textarea">
                        <span class="field-label"><span class="field-key">message</span><span class="punct">:</span></span>
                        <textarea name="message" rows="4" placeholder="Tulis pesan kamu di sini..." required></textarea>
                    </label>

                    <button type="submit" class="action action-primary form-submit">Kirim Pesan</button>

                </form>
            </div>
        </div>

        <p class="eof">// EOF</p>

    </main>

</body>
</html>
